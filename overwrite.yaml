- name: 🔯 全局故转
  type: fallback
  include-all: true
  exclude-filter: (?i)(剩余流量|到期时间|套餐到期|订阅到期|流量重置|官网地址|官方地址|更新订阅|Traffic Remaining|Expire Date)
  empty-fallback: REJECT
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  lazy: true
  expected-status: 204
- name: ♻️ 自动选择
  type: url-test
  include-all: true
  exclude-filter: (?i)(剩余流量|到期时间|套餐到期|订阅到期|流量重置|官网地址|官方地址|更新订阅|Traffic Remaining|Expire Date)
  empty-fallback: REJECT
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  lazy: true
  expected-status: 204
  tolerance: 50
- name: 🇯🇵 日本节点
  type: select
  include-all: true
  exclude-filter: (?i)(剩余流量|到期时间|套餐到期|订阅到期|流量重置|官网地址|官方地址|更新订阅|Traffic Remaining|Expire Date)
  empty-fallback: REJECT
  filter: (?i)(🇯🇵|(^|[^A-Za-z])JP([^A-Za-z]|$)|日本|Japan|Tokyo|Osaka)
- name: 🔯 日本故转
