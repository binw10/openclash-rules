# OpenClash/Mihomo 双机场覆写配置 | 2026-10-14
# 来源：qichiyuhub/rule/config/mihomo/config/overwrite.yaml（保留应用规则顺序）
# 不含代理节点或订阅 URL；必须与自己的 proxies / proxy-providers 合并。
# OpenClash 推荐 Fake-IP 非 TUN 模式；本文件禁止内核自行添加 TUN 路由。
# 管理接口仅监听本机，按用户要求不设置密钥。LAN 面板访问请看配套说明。
# 两个机场须在同一份最终配置中加载；同名节点必须在订阅转换时加唯一后缀。
# 空地区/空机场组回退 REJECT，避免无节点时意外直连。
# 健康检查仅验证 204 探测，不保证 AI/流媒体解锁；AI/Wallet 建议固定单节点。
# QUIC 正常按应用分流；HY2 的节点传输和客户端 QUIC 流量是不同层次。
# 全部规则集通过默认代理下载并缓存；首次启动需已有可用节点。
# 可选：若日志证明非中国 UDP 443 有问题，可把下面一行放在 rules 最前面：
# - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
# 本文件不设置 external-ui / external-ui-url，由 OpenClash 管理面板。
# Gemini 独立分流：网页、API、AI Studio；优先于通用 AI / Google 规则。
# 2026-10-15：新增 X / Twitter 独立策略组，采用 MetaCubeX twitter.mrs 规则集。
mode: rule
mixed-port: 7890
allow-lan: true
bind-address: '*'
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 127.0.0.1:9090
secret: ''
sniffer:
  enable: true
  parse-pure-ip: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: false
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.lan
  - +.local
  - Mijia Cloud
  - +.push.apple.com
tun:
  enable: false
  stack: mips
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
dns:
  enable: true
  listen: 127.0.0.1:7874
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - +.home.arpa
  - +.arpa
  - localhost
  - +.market.xiaomi.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - time.*.gov
  - +.pool.ntp.org
  - rule-set:private_domain
  - rule-set:cn_domain
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  nameserver:
  - https://1.1.1.1/dns-query#🚀 默认代理
  - https://8.8.8.8/dns-query#🚀 默认代理
  nameserver-policy:
    rule-set:cn_domain,private_domain:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
